name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─── Job 1: JS/TS lint + typecheck ────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Turborepo)
        run: pnpm turbo lint

      - name: Typecheck (Turborepo)
        run: pnpm turbo typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/backend-api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python linting tools
        working-directory: apps/backend-api
        run: pip install uv --no-cache-dir && uv pip install --system ".[dev]"

      - name: Lint Python (ruff check)
        working-directory: apps/backend-api
        run: ruff check .

      - name: Format check Python (ruff format)
        working-directory: apps/backend-api
        run: ruff format --check .

  # ─── Job 2: Backend tests ─────────────────────────────────────────────────
  test-backend:
    name: Test — Backend (Python 3.12)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/backend-api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: apps/backend-api
        run: pip install uv --no-cache-dir && uv pip install --system -e ".[dev]"

      - name: Run tests
        working-directory: apps/backend-api
        env:
          ENVIRONMENT: test
          REDIS_URL: redis://localhost:6379
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_JWT_SECRET: test-secret-32-chars-minimum-here-ok
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ─── Job 3: Frontend tests ────────────────────────────────────────────────
  test-frontend:
    name: Test — Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (Vitest via Turborepo)
        run: pnpm turbo test
